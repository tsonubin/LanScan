name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            qt_arch: win64_msvc2022_64
            cmake_generator: Visual Studio 17 2022
            cmake_args: -A x64
            build_parallel: 4
            artifact_name: LanScan-Windows
          - name: Linux
            os: ubuntu-24.04
            qt_arch: linux_gcc_64
            cmake_generator: Unix Makefiles
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            build_parallel: 2
            artifact_name: LanScan-Linux
          - name: macOS
            os: macos-15-intel
            qt_arch: clang_64
            cmake_generator: Unix Makefiles
            cmake_args: -DCMAKE_BUILD_TYPE=Release
            build_parallel: 2
            artifact_name: LanScan-macOS

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.1'
          arch: ${{ matrix.qt_arch }}
          modules: 'qtcharts'
          cache: true

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -G "${{ matrix.cmake_generator }}"
          ${{ matrix.cmake_args }}
          -DCMAKE_PREFIX_PATH="$Qt6_DIR"

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.build_parallel }}

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          ctest --test-dir build
          --build-config Release
          --output-on-failure
          --tests-regex
          "^(DeviceTest|NetworkMetricsTest|IpAddressValidatorTest|StatisticsCalculatorTest|LoggerTest|SubnetCalculatorTest|JitterCalculatorTest|PacketLossCalculatorTest|DeviceRepositoryTest|CsvExporterTest|SettingsManagerTest|ChartViewModelTest|AlertServiceTest|XmlExporterTest|HtmlReportGeneratorTest|ThemeManagerTest|ScanConfigViewModelTest)$"

      - name: Stage artifact on Windows
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $artifactDir = "artifacts/${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Copy-Item build/Release/LanScan.exe $artifactDir/
          Copy-Item build/Release/oui_database.txt $artifactDir/ -ErrorAction SilentlyContinue
          Copy-Item build/Release/translations $artifactDir/translations -Recurse -ErrorAction SilentlyContinue
          windeployqt --release --dir $artifactDir "$artifactDir/LanScan.exe"

      - name: Stage artifact on Linux
        if: success() && runner.os == 'Linux'
        shell: bash
        run: |
          artifact_dir="artifacts/${{ matrix.artifact_name }}"
          mkdir -p "$artifact_dir"
          cp build/LanScan "$artifact_dir/"
          cp build/oui_database.txt "$artifact_dir/" 2>/dev/null || true
          cp -R build/translations "$artifact_dir/" 2>/dev/null || true

      - name: Stage artifact on macOS
        if: success() && runner.os == 'macOS'
        shell: bash
        run: |
          artifact_dir="artifacts/${{ matrix.artifact_name }}"
          mkdir -p "$artifact_dir"
          cp build/LanScan "$artifact_dir/"
          cp build/oui_database.txt "$artifact_dir/" 2>/dev/null || true
          cp -R build/translations "$artifact_dir/" 2>/dev/null || true

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: artifacts/${{ matrix.artifact_name }}
          if-no-files-found: error
